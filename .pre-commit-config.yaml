# Pre-commit hooks. Install with:
#   uv tool install pre-commit && pre-commit install
# Or via scripts/bootstrap.sh.
#
# These run on `git commit`. The `.githooks/pre-commit` script (which runs
# the security-auditor on dependency changes) is complementary and triggered
# by `scripts/setup-hooks.sh`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(frontend/|api/|docs/|\.github/).*\.(ts|tsx|js|jsx|json|yml|yaml|md|css|html)$
        exclude: |
          (?x)^(
            frontend/src/api/generated/.* |
            backend/app/models/_generated/.* |
            .*\.lock |
            pnpm-lock\.yaml
          )$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3018]

  - repo: local
    hooks:
      - id: sync-tfvars
        name: Sync and Filter Global Terraform Variables
        entry: infrastructure/layers/sync_tfvars.py
        language: script
        files: ^infrastructure/layers/(dev\.tfvars|prod\.tfvars|sync_tfvars\.py)$
        pass_filenames: false
