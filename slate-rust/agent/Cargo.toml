[package]
name = "slate-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core decoupled automation engine, Slint bridge, and ACP extensions for Slate desktop applications"

[dependencies]
slint.workspace = true
i-slint-core.workspace = true
# Phase 2 (D1): production use of the Slint 1.18 ElementHandle query pipeline
# (ElementQuery/ElementHandle) for Slint-first targeting. The query API only
# ships in i-slint-backend-testing in 1.18 (no `mcp` feature enabled, no new
# crates); the testing *backend* itself is never installed by production code.
i-slint-backend-testing.workspace = true
slate-core = { path = "../core" }
slate-utils = { path = "../utils" }
thiserror.workspace = true
image.workspace = true
log.workspace = true

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
async-trait = "0.1"
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros"] }
env_logger.workspace = true
