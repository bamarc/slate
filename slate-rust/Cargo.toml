[workspace]
resolver = "2"
members = [
    "agent",
    "mcp",
    "core",
    "utils",
    "extensions",
    "lib",
    "examples/showcase",
    "test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Slate Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slate-framework/slate"

[workspace.dependencies]
slint = "1.18.1"
slint-build = "1.18.1"
i-slint-core = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
image = "0.25"

# Optimise third-party crates (slint, femtovg, rustybuzz, ...) in dev builds. Unoptimised text
# shaping / glyph rasterisation made the first draw of each showcase tab take 200-600 ms.
[profile.dev.package."*"]
opt-level = 2
