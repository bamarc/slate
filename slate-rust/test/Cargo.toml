[package]
name = "slate-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Integration tests for the Slate framework"

[dependencies]
slate = { path = "../lib" }
slate-core = { path = "../core" }
slate-utils = { path = "../utils" }
slate-extensions = { path = "../extensions" }
slint.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
image.workspace = true
base64 = "0.23"
async-trait = "0.1"
thiserror.workspace = true
log.workspace = true
env_logger = "0.11"

[[bin]]
name = "e2e_runner"
path = "src/bin/e2e_runner.rs"
