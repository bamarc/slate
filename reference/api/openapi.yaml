openapi: "3.1.0"
info:
  title: "${{ values.projectTitle }} API"
  version: "0.1.0"
  description: "Contract-first API specification for ${{ values.projectName }}"

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - OAuth2: []

paths:
  /api/v1/health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      security: []
      tags: [System]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      tags: [Auth]
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/mock-token:
    post:
      operationId: issueMockToken
      summary: Issue a signed mock JWT for local development
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockTokenRequest"
      responses:
        "200":
          description: Mock token successfully issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockTokenResponse"
        "404":
          description: Mock token endpoint not available in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/items:
    get:
      operationId: listItems
      summary: List items (paginated)
      tags: [Items]
      security:
        - OAuth2: [user, admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated list of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createItem
      summary: Create a new item
      tags: [Items]
      security:
        - OAuth2: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: getItem
      summary: Get an item by ID
      tags: [Items]
      security:
        - OAuth2: [user, admin]
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateItem
      summary: Update an existing item
      tags: [Items]
      security:
        - OAuth2: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteItem
      summary: Delete an item
      tags: [Items]
      security:
        - OAuth2: [admin]
      responses:
        "204": {description: Item deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth2 / OIDC bearer token issued by the configured identity provider
        (Microsoft Entra ID, Keycloak, Google Cloud Identity Platform, or any
        other OIDC IdP). Roles are read from the configured roles claim.

        Template roles: `user`, `admin`. Extend via `Role.register(...)` in
        backend code and update `auth_role_mapping` in config.
      flows:
        authorizationCode:
          authorizationUrl: https://idp.example.com/authorize
          tokenUrl: https://idp.example.com/token
          refreshUrl: https://idp.example.com/token
          scopes:
            user: Read access (template role)
            admin: Full read/write access (template role)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, default: 1, minimum: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, default: 20, minimum: 1, maximum: 100}

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: Authenticated but lacking the required role
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}

  schemas:
    HealthResponse:
      type: object
      properties:
        status: {type: string, example: ok, enum: [ok, degraded]}
        version: {type: string, example: "0.1.0"}
        database: {type: string, example: connected, enum: [connected, unreachable]}
      required: [status, version, database]

    ErrorResponse:
      type: object
      properties:
        detail: {type: string}
        correlation_id: {type: string}
      required: [detail]

    UserInfo:
      type: object
      properties:
        subject: {type: string}
        email: {type: string, nullable: true}
        name: {type: string, nullable: true}
        roles:
          type: array
          items: {type: string}
        issuer: {type: string}
      required: [subject, roles, issuer]

    ItemCreate:
      type: object
      properties:
        title: {type: string, maxLength: 255, minLength: 1}
        description: {type: string, nullable: true}
      required: [title]

    ItemUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 255, minLength: 1, nullable: true}
        description: {type: string, nullable: true}

    ItemResponse:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        description: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, title, created_at, updated_at]

    PageItemResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ItemResponse"}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        pages: {type: integer}
      required: [items, total, page, page_size, pages]

    MockTokenRequest:
      type: object
      properties:
        kid: {type: string, example: K99998}
        name: {type: string, example: "John Doe", nullable: true}
        email: {type: string, example: "john.doe@example.com", nullable: true}
        roles:
          type: array
          items: {type: string}
          example: ["admin"]
      required: [kid]

    MockTokenResponse:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
      required: [access_token, token_type]
