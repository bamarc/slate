[package]
name = "slate-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Model Context Protocol (MCP) server adapter and transports for Slate Agent"

[dependencies]
slate-agent = { path = "../agent" }
slate-core = { path = "../core" }
slint.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util", "io-std", "process"] }
async-trait = "0.1"
base64 = "0.23"

[[bin]]
name = "slate-mcp"
path = "src/bin/slate_mcp.rs"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros"] }
i-slint-backend-testing = "1.18.1"
image.workspace = true

