[alembic]
script_location = alembic
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/${{ values.projectName | replace('-', '_') }}

# Async drivers (like asyncpg) don't work with Alembic's sync engine_from_config.
# Use a sync driver (psycopg2, pg8000) here. The application uses async via
# the DATABASE_URL in app/core/config.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
